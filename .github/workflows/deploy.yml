name: Deploy website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Prepare cPanel release
        run: |
          mkdir -p release
          cp -a frontend/dist/. release/
          cp .deploy/cpanel-php/api.php release/api.php
          cp .deploy/cpanel-php/.htaccess release/.htaccess

      - name: Upload to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.nikoosalamat.ir
          username: deploy@nikoosalamat.ir
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: release/
          server-dir: /
