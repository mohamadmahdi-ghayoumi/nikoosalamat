name: Deploy website to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Prepare cPanel release
        run: |
          mkdir -p release
          cp -a frontend/dist/. release/
          cp .deploy/cpanel-php/api.php release/api.php
          cp .deploy/cpanel-php/.htaccess release/.htaccess
          mkdir -p release/app
          cp .deploy/cpanel-php/app/support.php release/app/support.php
          cp .deploy/cpanel-php/app/support-worker.php release/app/support-worker.php
          cp .deploy/cpanel-php/app/support-identify.php release/app/support-identify.php
          cp backend/app/support_schema.sql release/app/support-schema.sql
          cp .deploy/cpanel-php/app/faqs.php release/app/faqs.php
          cp backend/app/faq_schema.sql release/app/faq-schema.sql
          cp backend/app/faq_seed.json release/app/faq-seed.json
          cp .deploy/cpanel-php/app/home-text.php release/app/home-text.php
          cp backend/app/home_text_schema.sql release/app/home-text-schema.sql
          cp backend/app/home_text_fields.json release/app/home-text-fields.json

      - name: Package release
        run: |
          printf '%s\n' "$GITHUB_SHA" > deploy-version.txt
          cd release
          zip -qr ../nikoosalamat-release.zip .

      - name: Publish production package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view production >/dev/null 2>&1; then
            gh release upload production \
              nikoosalamat-release.zip \
              deploy-version.txt \
              --clobber
          else
            gh release create production \
              nikoosalamat-release.zip \
              deploy-version.txt \
              --target "$GITHUB_SHA" \
              --title "Production deployment" \
              --notes "Automatically generated deployment files." \
              --latest=false
          fi
